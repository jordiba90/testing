<script>
  async function llamarAPython() {
    try {
      const url = "https://testing-backend-git-master-jordiba90.vercel.app/"; 
      const res = await fetch(url);
      const datos = await res.json();
      
      document.getElementById('pantalla').innerText = datos.resultado; 
    } catch (e) {
      console.error(e);
      document.getElementById('pantalla').innerText = "Error al conectar con el backend";
    }
  }
</script>

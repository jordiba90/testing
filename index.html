<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>testing.cat</title>
</head>

<body>

<input id="nombre" placeholder="Escribe tu nombre">
<button onclick="llamarAPython()">Saludar</button>

<p id="pantalla"></p>

<script>
    async function llamarAPython() {
        const nombre = document.getElementById("nombre").value;
        const pantalla = document.getElementById("pantalla");

        const res = await fetch(
            `https://testing-backend-liart.vercel.app/scripts?name=${encodeURIComponent(nombre)}`
        );

        const datos = await res.json();

        pantalla.innerText = datos.resultado;
    }
</script>



</body>
</html>

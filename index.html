<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>testing.cat</title>
</head>
<body>

    <p id="pantalla">Cargando texto dinámico...</p>

    <script>
      async function llamarAPython() {
        const pantalla = document.getElementById('pantalla');
        try {
          const url = "https://vercel.com/jordiba90/testing-backend"; 
          const res = await fetch(url);
          
          const textoCrudo = await res.text();
          
          if (!res.ok) {
            pantalla.innerText = `Error del servidor: ${res.status}`;
            return;
          }

          const datos = JSON.parse(textoCrudo);
          pantalla.innerText = datos.resultado; 
        } catch (e) {
          console.error(e);
          pantalla.innerText = "Error: No se pudo procesar la respuesta.";
        }
      }

      // Ejecuta la función de forma automática al cargar la web
      window.onload = llamarAPython;
    </script>

</body>
</html>

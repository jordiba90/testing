<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>testing.cat</title>
</head>

<body>

    <p id="pantalla">Cargando texto dinámico2...</p>

<script>
  async function llamarAPython() {
    try {
      // URL real y exacta basada en tu configuración de Vercel
      const url = "https://vercel.app"; 
      
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
      
      const datos = await res.json();
      
      // Inserta el resultado de la función de Python en tu HTML
      document.getElementById('pantalla').innerText = datos.resultado; 
    } catch (e) {
      console.error("Error de conexión:", e);
      document.getElementById('pantalla').innerText = "Error al conectar con el backend";
    }
  }
</script>


</body>
</html>

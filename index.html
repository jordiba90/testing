<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>testing.cat</title>
</head>
<body>

    <button onclick="llamarAPython()">Ejecutar</button>
    <p id="pantalla"></p>

    <script>
  async function llamarAPython() {
    const pantalla = document.getElementById('pantalla');
    try {
      const url = "https://vercel.app"; 
      const res = await fetch(url);
      
      // En vez de procesar JSON directo, leemos el texto crudo para investigar
      const textoCrudo = await res.text();
      
      if (!res.ok) {
        pantalla.innerText = `Error ${res.status}: Código roto en servidor.`;
        console.log("Respuesta de Vercel:", textoCrudo);
        return;
      }

      // Si todo está bien, lo volvemos objeto e imprimimos el resultado
      const datos = JSON.parse(textoCrudo);
      pantalla.innerText = datos.resultado; 
    } catch (e) {
      console.error(e);
      pantalla.innerText = "Error: La respuesta no es un JSON válido.";
    }
  }
</script>


</body>
</html>

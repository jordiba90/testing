<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>testing.cat</title>
</head>

<body>

    <p id="pantalla">Cargando texto dinámico...</p>

    <script>
        async function llamarAPython() {
            const pantalla = document.getElementById("pantalla");

            try {
                const url = "https://testing-backend-liart.vercel.app/scripts";

                const res = await fetch(url);

                if (!res.ok) {
                    throw new Error(`HTTP ${res.status}`);
                }

                const datos = await res.json();

                pantalla.innerText = datos.resultado;

            } catch (error) {
                console.error("Error al conectar con el backend:", error);

                pantalla.innerText =
                    "Error al conectar con el backend.";
            }
        }

        window.addEventListener("DOMContentLoaded", llamarAPython);
    </script>

</body>
</html>
